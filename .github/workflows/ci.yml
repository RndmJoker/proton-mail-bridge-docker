name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  shell:
    name: Shell scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The entrypoint runs unattended inside a container. A typo in it would
      # otherwise surface on a user's machine, not here.
      #
      # Pinned rather than using the runner's preinstalled shellcheck, whose
      # version nobody controls. An unpinned one reports different findings
      # than a contributor gets locally, and changes under us when the runner
      # image is updated.
      - name: Shellcheck
        run: |
          files=$(find docker scripts -name '*.sh' 2>/dev/null || true)
          if [ -z "$files" ]; then
            echo "No shell scripts yet, nothing to check."
            exit 0
          fi
          echo "$files"
          wget -qO- https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.x86_64.tar.xz \
            | tar xJ
          ./shellcheck-v0.11.0/shellcheck --version
          # shellcheck disable=SC2086
          ./shellcheck-v0.11.0/shellcheck $files

  dockerfile:
    name: Dockerfile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Hadolint
        run: |
          if [ ! -f docker/Dockerfile ]; then
            echo "No Dockerfile yet, nothing to check."
            exit 0
          fi
          curl -sSLo hadolint \
            https://github.com/hadolint/hadolint/releases/download/v2.14.0/hadolint-Linux-x86_64
          chmod +x hadolint
          ./hadolint docker/Dockerfile

  go:
    name: Go
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for a Go module
        id: mod
        run: |
          if [ -f go.mod ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "No Go module yet, tests skipped."
          fi

      - uses: actions/setup-go@v5
        if: steps.mod.outputs.present == 'true'
        with:
          go-version-file: go.mod

      # The gRPC client is generated rather than committed, so nothing here
      # compiles until this has run. See proto/README.md for why.
      - name: Generate the gRPC client
        if: steps.mod.outputs.present == 'true'
        run: bash scripts/generate-proto.sh

      - name: Vet and test
        if: steps.mod.outputs.present == 'true'
        run: |
          go vet ./...
          go test ./...

  vuln:
    name: Vulnerabilities
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # govulncheck compiles what it scans, and nothing here compiles without
      # the generated client.
      - name: Generate the gRPC client
        run: bash scripts/generate-proto.sh

      # Fails the build on a reachable finding, and only on a reachable one.
      # govulncheck works from the call graph rather than the dependency list,
      # so a vulnerability in a package that is imported but never entered is
      # reported and does not block. That is the property worth having: what it
      # does flag is worth reading.
      #
      # This is a check that can turn red with no commit behind it - a
      # disclosure on a quiet Tuesday blocks every merge until somebody deals
      # with it. That is the trade, made deliberately; proton-mcp made the same
      # one for `npm audit`. The alternative is finding out from an alert weeks
      # later, in a project that handles a mailbox.
      - name: govulncheck
        run: bash scripts/ci/govulncheck.sh source

  proto:
    name: Interface definition
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # proto/bridge.proto is Proton's file, copied unchanged. Raising
      # BRIDGE_COMMIT without looking at it would otherwise be silent: the
      # image would build, the smoke test would pass, and a renamed field
      # would only show up as a call that quietly does nothing.
      - name: Compare against upstream
        run: |
          if [ ! -f proto/bridge.proto ]; then
            echo "No interface definition yet, nothing to compare."
            exit 0
          fi
          bash scripts/ci/check-proto.sh

  image:
    name: Container image
    runs-on: ubuntu-latest
    # Compiling the bridge from source is the slow part of this workflow.
    timeout-minutes: 45
    env:
      # The builder is chosen here rather than left to the runner's default.
      # BuildKit is what this image is expected to be built with; scripts/ci/
      # check-builder.sh below is what proves the variable took effect.
      DOCKER_BUILDKIT: 1
    steps:
      - uses: actions/checkout@v4

      # First, so that a wrong builder costs twenty seconds instead of the
      # three quarters of an hour the real build takes.
      - name: Which builder is in use
        run: bash scripts/ci/check-builder.sh

      # Building the image is also the only way to find out whether the pinned
      # upstream commit still fetches, so this runs on every change, not only
      # on changes under docker/.
      - name: Build the image and run the smoke test
        run: |
          if [ ! -f docker/Dockerfile ]; then
            echo "No Dockerfile yet, nothing to build."
            exit 0
          fi
          bash scripts/ci/smoke-test.sh

      # The larger half of #34, and the only look this project takes at
      # Proton's dependency tree. That tree is far bigger than ours and it is
      # the code that touches a mailbox; the source scan above sees none of it.
      #
      # Here rather than in its own job because the binary only exists after
      # the build, and the build is three quarters of an hour. This adds about
      # a minute to it.
      - uses: actions/setup-go@v5
        if: hashFiles('docker/Dockerfile') != ''
        with:
          go-version-file: go.mod

      - name: Scan the bridge binary
        if: hashFiles('docker/Dockerfile') != ''
        env:
          # Reports rather than fails, and the reason is in govulncheck.sh:
          # the only responses available here are to raise the pinned upstream
          # commit or to wait for Proton. A merge blocked by something the
          # change in front of it cannot fix is a red mark that gets clicked
          # past, which is worse than a warning that gets read.
          ADVISORY: "1"
        run: |
          # Out of the image rather than off a running container: `docker
          # create` makes no process, so this works whether or not the
          # entrypoint would start.
          id="$(docker create proton-mail-bridge:smoke)"
          docker cp "$id:/usr/local/bin/bridge" ./bridge-binary
          docker rm -f "$id" > /dev/null
          bash scripts/ci/govulncheck.sh binary ./bridge-binary

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Gitleaks needs the history to scan past commits, not just the tree.
          fetch-depth: 0

      - name: Gitleaks
        run: |
          wget -qO- https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz | tar xz

          # The config is passed explicitly rather than left to discovery, and
          # the job refuses to run without one.
          #
          # Measured on 2026-07-30 with gitleaks 8.24.3: when no .gitleaks.toml
          # is present, `gitleaks detect` reports a planted token as clean and
          # exits 0, while logging "using default gitleaks config". The same
          # file scanned with a config of only `[extend] useDefault = true`
          # reports "leaks found: 1".
          #
          # Discovery of an existing file works reliably, so this job was never
          # blind. What it could not survive is the file being renamed, moved or
          # deleted: that would have turned this check green forever instead of
          # breaking the build. The two guards below make that impossible.
          test -f .gitleaks.toml || { echo "::error::.gitleaks.toml is missing"; exit 1; }
          grep -q useDefault .gitleaks.toml || { echo "::error::.gitleaks.toml does not extend the built-in rules"; exit 1; }

          ./gitleaks detect --source . --config .gitleaks.toml --verbose --no-banner
