name: Publish

# Publishing happens on two occasions and no others.
#
#   - By hand, naming what to build. This is a decision, so somebody makes it.
#   - Once a night. The bridge is pinned to a commit hash, so the same source
#     is rebuilt on a newer Debian base: this is how security updates reach a
#     published image between two releases, which was six weeks last time.
#
# Deliberately not on every push to main. The build takes the better part of an
# hour and a change to the readme has no business starting one.
#
# ## Why tagging no longer triggers this, which it used to
#
# A workflow run uses the workflow file as it exists at the git ref of the
# triggering event. For a tag push that is the tagged commit, so a guard added
# to this file on main does not apply to a tag placed on an older commit. On
# 2026-07-31 that published two unfinished builds to two public registries
# (#40), because `PUBLISH=no` had been merged and the tags predated it.
#
# The lesson was not that the guard was in the wrong place. It was that tagging
# had a side effect at all. A tag is bookkeeping - it records that a version
# existed. Publishing is a decision. Coupling the two meant the decision got
# made by whoever ran `git push --tags`, which is not how it should be.
#
# So: `push: tags` is gone. Nothing about creating a tag reaches this file.
# What to build is an input, and the run is started on the default branch, so
# the workflow code always comes from main while the build contents come from
# wherever the input points.
#
# Tags on commits that predate this change still carry their own copy of the
# old trigger, and nothing here can reach those. That gap is covered outside
# GitHub, in tag-release.sh, which is the one place that sees both the target
# commit and main. See git-workflow.md in the rules repository.
#
# A new upstream bridge release does NOT trigger a build either. That is
# .github/workflows/upstream.yml, and all it does is file an issue: what Proton
# changed gets looked at by a person before anything is published under this
# name.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: >-
          Tag or commit to build and publish. Empty builds the branch this run
          was started on.
        required: false
        type: string
  schedule:
    # Off the hour on purpose. Scheduled runs across GitHub queue at :00, and a
    # job placed there is regularly delayed by ten minutes or more.
    #
    # 03:23 UTC. Nothing depends on the exact time; the nightly rebuild only
    # picks up base image updates and nobody is waiting for it.
    #
    # Note that GitHub disables scheduled workflows after 60 days without any
    # activity in the repository. A quiet stretch that long stops the rebuild
    # without saying so.
    - cron: '23 3 * * *'

# Two publish runs must never overlap, and this is why.
#
# Most of the tags this pushes - `3.25.0`, `3.25`, `edge` - do not name an
# image version. Two runs building different sources therefore compete for the
# same three names in the same two repositories, and whichever finishes last
# wins each of them, per registry, independently.
#
# That is what happened on 2026-07-31 and it was misread as a registry
# problem. Measured afterwards: the v0.5.0 run pushed from 15:21:12 to
# 15:21:33 and the v0.5.1 run from 15:21:25 to 15:21:48, overlapping by eight
# seconds, and the digest comparison in push-image.sh then reported two
# different digests for "the same" image. They were not the same image. See
# #39.
#
# `cancel-in-progress: false` on purpose: a publish that has already pushed
# some of its tags must not be killed halfway. The second run waits.
concurrency:
  group: publish
  cancel-in-progress: false

permissions:
  contents: read

env:
  # See scripts/ci/check-builder.sh for why this is stated rather than assumed.
  DOCKER_BUILDKIT: 1

  # What the image is called inside the runner, before it is tagged for the
  # registries. Only the smoke test ever sees this name.
  LOCAL_IMAGE: proton-mail-bridge:publish

  DOCKERHUB_USER: rndmjoker

jobs:
  # Whether anything may be pushed at all is a decision that lives in the
  # repository, in the PUBLISH file, which carries the reasoning. Its own job
  # rather than a step, so that a `no` shows the work below as **skipped**.
  #
  # That distinction is the point. A failing step would paint the run red every
  # night for a state that is intended, and a red mark nobody reads is worse
  # than none. A passing step would leave a green run that looks like it
  # published something. Skipped is what actually happened.
  gate:
    name: May this publish
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.check.outputs.enabled }}
    steps:
      # Fails the run rather than skipping it, unlike the PUBLISH check below.
      # A `no` in PUBLISH is an intended state that recurs nightly; being
      # started on the wrong ref is a mistake that happens once and has to be
      # seen.
      #
      # Why it matters: a run started on a tag would read this file from that
      # tag, which is exactly the situation #40 was about. What to build is an
      # input; where the workflow comes from is not negotiable.
      - name: This has to run on the default branch
        env:
          STARTED_ON: ${{ github.ref }}
          DEFAULT_BRANCH: refs/heads/${{ github.event.repository.default_branch }}
        run: |
          if [ "$STARTED_ON" != "$DEFAULT_BRANCH" ]; then
            echo "::error::Started on $STARTED_ON, which is not $DEFAULT_BRANCH."
            echo "::error::The workflow file must come from the default branch, or a guard added there does not apply."
            echo "::error::To build a tag, start this on the default branch and name the tag in the 'ref' input."
            exit 1
          fi

      # No `ref:`. This job reads PUBLISH from the default branch on purpose:
      # whether this project publishes at all is a decision about now, not a
      # property of whatever old commit is being built.
      - uses: actions/checkout@v7

      - name: Read the PUBLISH file
        id: check
        run: bash scripts/ci/check-publish-enabled.sh

  publish:
    name: Build, test and publish
    needs: gate
    if: needs.gate.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    # The image job in ci.yml allows 45 minutes for the build alone. This does
    # the same build, the same smoke test, and then two pushes.
    timeout-minutes: 75
    permissions:
      contents: read
      # ghcr.io authenticates with the workflow's own GITHUB_TOKEN, so there is
      # no secret to store for it. Docker Hub is a separate namespace and needs
      # one.
      packages: write
      # Build provenance is signed keyless through Sigstore: the workflow's
      # OIDC token is the identity, and the certificate it gets back lives for
      # minutes. No private key is stored anywhere, which is the entire appeal.
      id-token: write
      attestations: write
    steps:
      # Here the ref does apply: this is the source that gets built. The
      # workflow file has already been fixed to the default branch by the time
      # this runs, so the two cannot be confused.
      #
      # On a scheduled run there is no input and this is the default branch,
      # which is what the nightly rebuild is for.
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: What is being built
        env:
          BUILD_REF: ${{ inputs.ref || github.ref }}
        run: |
          echo "Workflow file from: ${{ github.ref }}"
          echo "Source built:       $BUILD_REF -> $(git rev-parse HEAD)"
          {
            echo "### Building"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Workflow file from | \`${{ github.ref }}\` |"
            echo "| Source built | \`$BUILD_REF\` (\`$(git rev-parse HEAD)\`) |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Which builder is in use
        run: bash scripts/ci/check-builder.sh

      # Everything that can be decided without building is decided first. A
      # missing token or an unparseable version should cost twenty seconds, not
      # the three quarters of an hour it takes to find out at the end.
      - name: Work out the tags
        id: tags
        run: bash scripts/ci/image-tags.sh

      - name: Check that both registries can be reached
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Through the environment rather than interpolated into the script.
          # A `${{ }}` inside a run block is pasted in as text before the shell
          # ever sees it, which is how a value ends up being executed instead
          # of read.
          GHCR_USER: ${{ github.repository_owner }}
        run: |
          if [ -z "$DOCKERHUB_TOKEN" ]; then
            echo "::error::DOCKERHUB_TOKEN is not set, so half of this would not be published."
            echo "::error::Create an access token with write permission on hub.docker.com and store it as a repository secret."
            exit 1
          fi
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
          printf '%s' "$DOCKERHUB_TOKEN" | docker login docker.io -u "$DOCKERHUB_USER" --password-stdin

      # One invocation builds and tests. The build arguments live in
      # smoke-test.sh, which reads docker/bridge-version itself, so there is no
      # second copy of them here to drift out of step.
      #
      # Nothing is published that did not pass this.
      - name: Build the image and run the smoke test
        env:
          IMAGE: ${{ env.LOCAL_IMAGE }}
        run: bash scripts/ci/smoke-test.sh

      - name: Push to both registries
        id: push
        run: bash scripts/ci/image-tags.sh | bash scripts/ci/push-image.sh

      # What this records is that this image, at this digest, was built by this
      # workflow in this repository at this commit. Whoever pulls it can check
      # that without trusting a signing key that someone had to keep somewhere.
      #
      # Pinned to the major tag rather than a commit, unlike everything else in
      # this repository's CI. A frozen version of a signing action rots against
      # the Sigstore infrastructure it talks to, and there is nothing here to
      # notice when it does.
      #
      # Filed twice, once per registry. The digest is the same for both, so one
      # attestation would very likely cover both; verifying by name as well as
      # by digest is worth one extra step rather than finding out it did not.
      - name: Attest the image on ghcr.io
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ghcr.io/rndmjoker/proton-mail-bridge-docker
          subject-digest: ${{ steps.push.outputs.digest }}
          # Stores the attestation next to the image, so it can be found
          # without asking GitHub. Only for ghcr: Docker Hub's support for OCI
          # referrers is newer and this has no way to test it beforehand.
          push-to-registry: true

      - name: Attest the image on Docker Hub
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: docker.io/rndmjoker/proton-mail-bridge-docker
          subject-digest: ${{ steps.push.outputs.digest }}

      # After the push, because the first push is what creates the repository
      # on Docker Hub and an empty repository cannot be described.
      - name: Update the Docker Hub description
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: bash scripts/ci/sync-dockerhub-description.sh

      - name: What was published
        run: |
          echo "### Published" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          bash scripts/ci/image-tags.sh >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "Digest: \`${{ steps.push.outputs.digest }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Check where it came from:" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "gh attestation verify oci://ghcr.io/rndmjoker/proton-mail-bridge-docker@${{ steps.push.outputs.digest }} --repo ${{ github.repository }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
